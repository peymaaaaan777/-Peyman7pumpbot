      - name: Check LIVE_TRADING
        env:
          LIVE_TRADING: "true"
        run: |
          echo "LIVE_TRADING=$LIVE_TRADING"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          LIVE_TRADING: "true"
        run: |
          echo "Starting bot..."
          python bot.py
